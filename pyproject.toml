[project]
name = "code"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.3",
    "langchain-deepseek>=1.1.1",
    "langchain-community>=0.4.2",
    "unstructured[docx,md]>=0.27.36",
    "en_core_web_sm",
    "FlagEmbedding>=1.3.5",
    "torch>=2.8.0",
    "pymilvus>=3.0.2",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
]

[tool.uv.sources]
en_core_web_sm = { path = "2 RAG/models/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu128"
explicit = true
